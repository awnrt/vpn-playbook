- name: Install Unbound
  ansible.builtin.apt:
    name: unbound
    state: present
    update_cache: true
    policy_rc_d: 101

- name: Ensure Unbound state directory exists
  ansible.builtin.file:
    path: /var/lib/unbound
    state: directory
    owner: unbound
    group: unbound
    mode: "0755"

- name: Initialize Unbound DNSSEC trust anchor from Debian root data
  ansible.builtin.copy:
    src: /usr/share/dns/root.key
    dest: /var/lib/unbound/root.key
    remote_src: true
    force: false
    owner: unbound
    group: unbound
    mode: "0644"

- name: Ensure Unbound can maintain its DNSSEC trust anchor
  ansible.builtin.file:
    path: /var/lib/unbound/root.key
    state: file
    owner: unbound
    group: unbound
    mode: "0644"

- name: Ensure Unbound config directory exists
  ansible.builtin.file:
    path: /etc/unbound/unbound.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Unbound
  ansible.builtin.template:
    src: unbound.conf.j2
    dest: /etc/unbound/unbound.conf
    owner: root
    group: root
    mode: "0644"
    validate: "unbound-checkconf %s"
  notify: Restart unbound

- name: Prepare local resolver before starting Unbound
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/prepare-local-dns.yml"

- name: Ensure Unbound is enabled and running
  ansible.builtin.systemd:
    name: unbound
    enabled: true
    state: started
