---
- name: Install UFW
  ansible.builtin.package:
    name: ufw
    state: present

- name: Set UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Allow required ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: "{{ ssh_port }}", proto: tcp }
    - { port: "80", proto: tcp }
    - { port: "443", proto: tcp }
    - { port: "443", proto: udp }
    - { port: "{{ amneziawg_port }}", proto: udp }

- name: Allow all incoming traffic on AmneziaWG interface
  community.general.ufw:
    rule: allow
    direction: in
    interface: awg0

- name: Enable UFW
  community.general.ufw:
    state: enabled
