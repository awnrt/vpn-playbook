---
- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Wait for host DNS to resolve the SagerNet repository
  ansible.builtin.command:
    argv:
      - getent
      - ahostsv4
      - sing-box.app
  register: singbox_repo_dns
  changed_when: false
  retries: 6
  delay: 5
  until: singbox_repo_dns.rc == 0

- name: Download SagerNet signing key
  ansible.builtin.get_url:
    url: "https://sing-box.app/gpg.key"
    dest: "/etc/apt/keyrings/sagernet.asc"
    owner: root
    group: root
    mode: "0644"

- name: Add SagerNet APT source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/sagernet.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://deb.sagernet.org/
      Suites: *
      Components: *
      Enabled: yes
      Signed-By: /etc/apt/keyrings/sagernet.asc
