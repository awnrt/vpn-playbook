---
- name: Ensure sing-box config directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ singbox_config_directory }}", group: "sing-box", mode: "0750" }

- name: Check for legacy monolithic sing-box configuration
  ansible.builtin.stat:
    path: /etc/sing-box/config.json
  register: singbox_legacy_config

- name: Remove legacy monolithic sing-box configuration
  ansible.builtin.file:
    path: /etc/sing-box/config.json
    state: absent
  when: singbox_legacy_config.stat.exists

- name: Ensure Reality key directory exists
  ansible.builtin.file:
    path: "{{ singbox_reality_key_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Require both predefined Reality keys
  ansible.builtin.assert:
    that:
      - (singbox_reality_private_key is defined) == (singbox_reality_public_key is defined)
    fail_msg: Define both singbox_reality_private_key and singbox_reality_public_key, or leave both undefined.

- name: Install predefined Reality private key
  ansible.builtin.copy:
    content: "{{ singbox_reality_private_key | trim }}\n"
    dest: "{{ singbox_reality_private_key_file }}"
    owner: root
    group: root
    mode: "0600"
  when: singbox_reality_private_key is defined
  no_log: true

- name: Install predefined Reality public key
  ansible.builtin.copy:
    content: "{{ singbox_reality_public_key | trim }}\n"
    dest: "{{ singbox_reality_public_key_file }}"
    owner: root
    group: root
    mode: "0644"
  when: singbox_reality_public_key is defined
  no_log: true

- name: Check whether Reality private key already exists
  ansible.builtin.stat:
    path: "{{ singbox_reality_private_key_file }}"
  register: singbox_reality_private_key_stat

- name: Generate Reality keypair once
  ansible.builtin.shell: |
    set -o pipefail
    sing-box generate reality-keypair | awk '
      /^PrivateKey:/ { print $2 > "{{ singbox_reality_private_key_file }}" }
      /^PublicKey:/  { print $2 > "{{ singbox_reality_public_key_file }}" }
    '
  args:
    executable: /bin/bash
  when:
    - singbox_reality_private_key is not defined
    - not singbox_reality_private_key_stat.stat.exists
  changed_when: true

- name: Set permissions on Reality key files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ singbox_reality_private_key_file }}", mode: "0600" }
    - { path: "{{ singbox_reality_public_key_file }}", mode: "0644" }

- name: Verify Reality key files exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ singbox_reality_private_key_file }}"
    - "{{ singbox_reality_public_key_file }}"
  register: singbox_reality_key_files

- name: Ensure both Reality key files exist
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "Reality key file is missing: {{ item.item }}"
  loop: "{{ singbox_reality_key_files.results }}"

- name: Read Reality private key
  ansible.builtin.slurp:
    src: "{{ singbox_reality_private_key_file }}"
  register: singbox_reality_private_key_raw
  no_log: true

- name: Read Reality public key
  ansible.builtin.slurp:
    src: "{{ singbox_reality_public_key_file }}"
  register: singbox_reality_public_key_raw

- name: Set Reality facts
  ansible.builtin.set_fact:
    singbox_reality_private_key: "{{ singbox_reality_private_key_raw.content | b64decode | trim }}"
    singbox_reality_public_key: "{{ singbox_reality_public_key_raw.content | b64decode | trim }}"
  no_log: true

- name: Install static sing-box configuration fragments
  ansible.builtin.copy:
    src: "config/{{ item }}"
    dest: "{{ singbox_config_directory }}/{{ item }}"
    owner: root
    group: "sing-box"
    mode: "0640"
  loop:
    - 00-log.json
    - 20-dns.json
    - 40-outbound-direct.json
    - 50-route.json
  notify: Restart sing-box

- name: Render VLESS Reality inbound fragment
  ansible.builtin.template:
    src: 30-inbound-vless-reality.json.j2
    dest: "{{ singbox_config_directory }}/30-inbound-vless-reality.json"
    owner: root
    group: "sing-box"
    mode: "0640"
    validate: "python3 -m json.tool %s"
  notify: Restart sing-box

- name: Install custom sing-box configuration fragments
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ singbox_config_directory }}/{{ item.dest }}"
    owner: root
    group: "sing-box"
    mode: "0640"
  loop: "{{ singbox_custom_config_files | default([]) }}"
  notify: Restart sing-box

- name: Validate merged sing-box configuration
  ansible.builtin.command:
    argv:
      - sing-box
      - -C
      - "{{ singbox_config_directory }}"
      - check
  changed_when: false
