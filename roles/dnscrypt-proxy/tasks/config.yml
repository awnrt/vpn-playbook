---
- name: Install dnscrypt-proxy config
  ansible.builtin.template:
    src: dnscrypt-proxy.toml.j2
    dest: /etc/dnscrypt-proxy/dnscrypt-proxy.toml
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart dnscrypt-proxy

- name: Prepare local resolver before starting dnscrypt-proxy
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/prepare-local-dns.yml"

- name: Enable dnscrypt-proxy
  ansible.builtin.systemd:
    name: dnscrypt-proxy
    enabled: true
    state: started
